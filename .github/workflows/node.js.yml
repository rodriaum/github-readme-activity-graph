name: Node.js CI

on:
    push:
        branches: [main, 'fix/**']
    pull_request:
        branches: [main]

# CI builds and tests untrusted pull-request code without repository secrets.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x]
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm test -- --runInBand
