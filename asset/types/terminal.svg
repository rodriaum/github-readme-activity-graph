        <rect
            data-testid="card_bg"
            id="cardBg"
            x="0"
            y="0"
            rx="0"
            height="100%"
            width="100%"
            fill="#202124"
            fill-opacity="1"
            stroke="#0000"
            stroke-opacity="1"
            stroke-width="1"
        />

        <style>
            body {
                font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            }

            .header {
                font: 700 20px 'Segoe UI', Ubuntu, Sans-Serif;
                text-align: center;
                color: #fcfcfa;
                margin-top: 20px;
            }

            svg {
                font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
                user-select: none;
            }

            

            
        @keyframes blink {
            from {
                opacity: 0;
                transform:translateX(-20px); 
            }
            to {
                opacity:1;
                transform: translateX(0);
            }
        }
    
        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }
    
    

            .graph-animated-line {
                stroke-dasharray: 5000;
                stroke-dashoffset: 5000;
                animation: dash 5s ease-in-out forwards;
            }

            .graph-animated-point {
                opacity: 0;
                animation: blink 1s ease-in-out forwards;
            }

            .graph-animated-bar {
                transform-box: fill-box;
                transform-origin: bottom;
                animation: bar-grow .8s ease-out both;
            }

            @keyframes bar-grow {
                from {
                    transform: scaleY(0);
                    opacity: .2;
                }

                to {
                    transform: scaleY(1);
                    opacity: 1;
                }
            }
        </style>

