            x="0"
            y="0"
            width="1200"
            height="50"
        >
            <h1
                xmlns="http://www.w3.org/1999/xhtml"
                class="header"
            >
                Rodrigo Ferreira's Contribution Graph
            </h1>
        </foreignObject>

        
            
